[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "averiq-backend"
version = "0.1.0"
description = "Averiq backend service — AI Revenue Recovery Decision Engine"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Runtime dependencies (pinned for reproducibility)
# ---------------------------------------------------------------------------
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",

    # Database / ORM
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",

    # Task queue
    "celery[redis]==5.4.0",
    "redis==5.0.4",

    # Validation / settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # Auth / crypto
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",

    # Observability
    "structlog==24.1.0",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-exporter-otlp==1.24.0",
    "opentelemetry-instrumentation-fastapi==0.45b0",
    "opentelemetry-instrumentation-sqlalchemy==0.45b0",

    # HTTP client (async)
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "hypothesis==6.100.1",
    "httpx==0.27.0",

    # Linting / formatting
    "ruff==0.4.4",
    "mypy==1.10.0",

    # Type stubs
    "types-passlib==1.7.7.20240327",
    "types-redis==4.6.0.20240425",
]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",    # line length handled by formatter
    "ANN101",  # missing type annotation for `self`
    "ANN102",  # missing type annotation for `cls`
    "S101",    # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "structlog.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests (no I/O)",
    "integration: integration tests (requires Docker services)",
    "e2e: end-to-end Playwright tests",
    "security: security-focused test suite",
    "pbt: property-based tests",
]
