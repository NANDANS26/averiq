# Alembic configuration file for Averiq
#
# This file is read by `alembic` CLI and by the Makefile `make migrate` target.
# The `sqlalchemy.url` is intentionally left empty here; env.py reads it from
# settings.DATABASE_SYNC_URL so that credentials are never stored in this file.

[alembic]
# Path to migration scripts, relative to the location of this ini file.
script_location = %(here)s

# Template used when generating new migration files.
file_template = %%(rev)s_%%(slug)s

# sys.path is prepended with the directories listed here before migration
# scripts are imported. The project root is added so that `backend.*` and
# `shared.*` imports resolve correctly.
prepend_sys_path = .

# Truncate long revision IDs in file names to this number of characters.
truncate_slug_length = 40

# Output encoding for generated .py files.
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
