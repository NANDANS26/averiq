[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ---------------------------------------------------------------------------
# Workspace / project metadata
# ---------------------------------------------------------------------------
[project]
name = "averiq"
version = "0.1.0"
description = "Averiq — AI Revenue Recovery Decision Engine"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[project.optional-dependencies]
e2e = [
    "playwright>=1.43.0",
    "pytest-playwright>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "ai", "shared", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["backend", "ai", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests (no I/O)",
    "integration: integration tests (requires Docker services)",
    "e2e: end-to-end Playwright tests",
    "security: security-focused test suite",
    "pbt: property-based tests",
]

[tool.coverage.run]
source = ["backend", "ai", "shared"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
